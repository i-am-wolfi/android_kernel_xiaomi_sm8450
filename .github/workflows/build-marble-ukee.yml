name: build-marble-ukee-6.12

# calcite-6.12 (5.10 -> 6.12): base ltdq lineage-24.0 (6.11/android16-6.12) + ACK
# marble (Poco F5) / ukee (SM7475) sobre waipio. Build make direto + clang, SEM LTO.
on:
  workflow_dispatch:
  push:
    branches: [calcite-6.12]
    paths:
      - arch/**
      - drivers/**
      - vendor/**
      - modules-lists/**
      - build.config.msm.waipio
      - .github/workflows/build-marble-ukee.yml

env:
  ARCH: arm64
  LLVM: 1
  LLVM_IAS: 1
  CROSS_COMPILE: aarch64-linux-gnu-
  CLANG_TRIPLE: aarch64-linux-gnu-
  KBUILD_BUILD_USER: marble
  KBUILD_BUILD_HOST: action

jobs:
  image:
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - name: Deps + clang-19 + ccache (sem LTO = link rapido)
        run: |
          set -o pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq git-core flex bison build-essential \
            zlib1g-dev libssl-dev libelf-dev dwarves device-tree-compiler \
            gcc-aarch64-linux-gnu lz4 zstd cpio python3 lsb-release wget gnupg
          sudo bash -c "$(wget -O - https://apt.llvm.org/llvm.sh)" -- 19 clang lld 2>&1 | tail -n 3
          clang-19 --version | head -n 2
          echo "/usr/lib/llvm-19/bin" >> "$GITHUB_PATH"
          curl -sL https://github.com/ccache/ccache/releases/download/v4.14.1/ccache-4.14.1-linux-x86_64-glibc.tar.gz -o /tmp/ccache.tgz
          tar -xzf /tmp/ccache.tgz -C /tmp
          sudo install -m755 /tmp/ccache-4.14.1-linux-x86_64-glibc/ccache /usr/local/bin/ccache
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          ccache -M 4G; ccache -z; mkdir -p ~/.ccache
      - uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-marble-ukee-${{ hashFiles('.github/workflows/build-marble-ukee.yml') }}-v1
          restore-keys: ccache-marble-ukee-

      - name: Fetch dt-bindings diwali/ukee faltantes (MiCode marble-s-oss)
        run: |
          set -o pipefail
          fetch_one() { # $1 = path relativo a include/ (ex dt-bindings/foo/bar.h)
            dst="include/$1"
            [ -f "$dst" ] && return 0
            mkdir -p "$(dirname "$dst")"
            code=$(curl -sL -w "%{http_code}" "https://raw.githubusercontent.com/MiCode/Xiaomi_Kernel_OpenSource/marble-s-oss/include/$1" -o "$dst")
            [ "$code" = "200" ] || { rm -f "$dst"; echo "MISS $1 (http $code)"; return 1; }
            if [ "$(wc -c < "$dst")" -lt 120 ] && ! grep -qE "#| |;|\{|" "$dst"; then
              link=$(cat "$dst"); base=$(dirname "$1")
              target=$(python3 -c "import posixpath,sys; print(posixpath.normpath(posixpath.join(sys.argv[1], sys.argv[2])))" "$base" "$link")
              echo "SYMLINK $1 -> $target"
              rm -f "$dst"; fetch_one "$target" && cp "include/$target" "$dst"
              return 0
            fi
            [ "$(wc -c < "$dst")" -ge 50 ] || { rm -f "$dst"; echo "MISS $1 (miudo)"; return 1; }
            echo "FETCH $1"
          }
          grep -rhoE "dt-bindings/[A-Za-z0-9_,./-]+\.h" vendor/qcom/devicetrees/qcom/ 2>/dev/null | sort -u > /tmp/need.txt
          wc -l /tmp/need.txt
          for round in 1 2 3 4; do
            grep -rhoE "dt-bindings/[A-Za-z0-9_,./-]+\.h" include/dt-bindings/ 2>/dev/null | sort -u >> /tmp/need.txt || true
            sort -u /tmp/need.txt -o /tmp/need.txt
            added=0
            while read -r h; do
              if [ ! -f "include/$h" ]; then fetch_one "$h" && added=1 || true; fi
            done < /tmp/need.txt
            [ "$added" = "0" ] && break
          done
          echo "--- ainda faltando: ---"
          (while read -r h; do [ -f "include/$h" ] || echo "  $h"; done < /tmp/need.txt | head -n 30) || true
          echo "--- event codes (nao sobrescrever o novo 6.11) ---"
          mkdir -p include/dt-bindings/input include/uapi/linux
          if [ ! -f include/uapi/linux/input-event-codes.h ]; then
            fetch_one uapi/linux/input-event-codes.h || true
          fi
          if [ ! -f include/dt-bindings/input/linux-event-codes.h ] && [ -f include/uapi/linux/input-event-codes.h ]; then
            cp include/uapi/linux/input-event-codes.h include/dt-bindings/input/linux-event-codes.h
          fi

      - name: Defconfig marble/ukee (gki + fragment, sem LTO)
        run: |
          set -o pipefail
          ln -sfn ../../../../vendor/qcom/devicetrees arch/arm64/boot/dts/vendor
          ls -la arch/arm64/boot/dts/ | grep vendor
          PATH="/usr/lib/llvm-19/bin:$PATH" scripts/kconfig/merge_config.sh -m arch/arm64/configs/gki_defconfig arch/arm64/configs/marble_ukee.fragment
          PATH="/usr/lib/llvm-19/bin:$PATH" make ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig
          grep -E "^CONFIG_ARCH_WAIPIO|^CONFIG_ARCH_DIWALI|^CONFIG_LOCALVERSION|^CONFIG_LTO" .config
          if grep -q "^CONFIG_LTO_CLANG_THIN=y" .config; then echo "WARN: LTO_THIN ainda on (fragment LTO_NONE nao pegou)"; else echo "LTO off OK"; fi

      - name: DTBs fail-fast (log completo)
        run: |
          set -o pipefail
          export PATH="/usr/lib/llvm-19/bin:/usr/local/bin:$PATH"
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 KCPPFLAGS="-I$PWD" dtbs 2>&1 | tee /tmp/dtbs.log | tail -n 30
        timeout-minutes: 15

      - name: Build Image.gz + modules + dtbs (sem LTO, log completo)
        run: |
          set -o pipefail
          export PATH="/usr/lib/llvm-19/bin:/usr/local/bin:$PATH"
          nproc; free -g | head -n 2
          make -j$(nproc) CC="ccache clang" KCPPFLAGS="-I$PWD" Image.gz modules dtbs 2>&1 | tee /tmp/build.log | tail -n 30
          echo "--- ccache ---"; ccache -s | head -n 12
        timeout-minutes: 300

      - name: Coleta artefatos
        if: always()
        run: |
          set -o pipefail
          mkdir -p out
          cp -v arch/arm64/boot/Image* out/ 2>/dev/null || echo "SEM Image (build falhou, ver build.log)"
          cp -v System.map out/ 2>/dev/null || true
          cp -v .config out/marble-ukee-defconfig 2>/dev/null || true
          cp -v /tmp/dtbs.log out/dtbs.log 2>/dev/null || true
          cp -v /tmp/build.log out/build.log 2>/dev/null || true
          (find -L arch/arm64/boot/dts -name "diwali*.dtb" -exec cp -v {} out/ \; 2>/dev/null | tail -n 10) || true
          (find -L arch/arm64/boot/dts -name "*.dtbo" -exec cp -v {} out/ \; 2>/dev/null | tail -n 5) || true
          (ls -lh out/ | head -n 40) || true
          if [ -f arch/arm64/boot/Image.gz ]; then
            mkdir -p /tmp/mods
            (make INSTALL_MOD_PATH=/tmp/mods INSTALL_MOD_STRIP=1 modules_install 2>&1 | tail -n 3) || true
            (cd /tmp/mods && tar --zstd -cf "$GITHUB_WORKSPACE/out/vendor-modules.tar.zst" lib/ 2>/dev/null) || true
          else
            echo "SKIP modules_install (sem Image)"
          fi
          echo "--- erros do build (por arquivo, top 50) ---"
          (grep -aE "\.(c|h|S):[0-9]+:[0-9]+: (error|fatal error)" /tmp/build.log 2>/dev/null | sed -E 's/^.* ([a-zA-Z0-9_\/.-]+\.(c|h|S)):[0-9]+:[0-9]+: ((fatal )?error).*/\1/' | sort | uniq -c | sort -rn | head -n 50) || true
          echo "--- undefined symbols (top 20) ---"
          (grep -aE "ld.lld: error: undefined symbol" /tmp/build.log 2>/dev/null | sed -E 's/.*undefined symbol: //' | sort | uniq -c | sort -rn | head -n 20) || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marble-ukee-6.12
          path: out/
          retention-days: 7
